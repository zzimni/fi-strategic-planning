name: Weekly G2B Opportunity Scan

on:
  schedule:
    # 09:00 every Monday in Asia/Seoul.
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Seoul
      G2B_API_KEY: ${{ secrets.G2B_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run opportunity scanner
        run: python src/opportunity_scanner/scanner.py --top-n 999

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: g2b-opportunity-scan-${{ github.run_number }}
          path: |
            reports/*.xlsx
            logs/scanner.log
          if-no-files-found: error
          retention-days: 30